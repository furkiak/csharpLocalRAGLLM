name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build LocalRag.sln -c Release

      - name: Test
        run: dotnet test LocalRag.sln -c Release --no-build

      - name: Pack (library and dotnet tool)
        run: dotnet pack LocalRag.sln -c Release --no-build -o artifacts

      - name: Install the tool from the package and run it
        shell: bash
        run: |
          dotnet tool install LocalRag --tool-path ./tool --add-source ./artifacts --version "$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          ./tool/localrag --version
          ./tool/localrag list --db ./ci-index.db
