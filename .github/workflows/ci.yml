name: Source and fixture checks
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r requirements-bootstrap.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements-bootstrap.txt -r requirements-dev.txt --strict
      - run: dotnet build CSharpLocalRag.csproj -c Release
      - run: dotnet test CSharpLocalRag.Tests/CSharpLocalRag.Tests.csproj -c Release
      - run: python -m pytest -q
      - run: python eval/run.py
