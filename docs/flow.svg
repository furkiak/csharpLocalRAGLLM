<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Current local retrieval flow and future LLM gate</title>
  <desc id="desc">C# client sends a file path or question to the loopback Python API. Allowed local text and PDF files are chunked, embedded and stored with source metadata in Chroma. Query returns an exact source excerpt or no-answer. Generative LLM is explicitly future work.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1a2d"/><stop offset="1" stop-color="#163847"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#263b58"/><stop offset="1" stop-color="#1b3049"/></linearGradient>
  </defs>
  <rect width="1000" height="360" rx="30" fill="url(#bg)"/>
  <text x="42" y="56" fill="#e9f3ff" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">C# Local RAG</text>
  <text x="42" y="80" fill="#a8c3d9" font-family="Segoe UI,Arial,sans-serif" font-size="14">0.2.0-preview.1 · source workflow, not an application screenshot</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="42" y="125" width="172" height="128" rx="20" fill="url(#card)" stroke="#7c9bc0"/>
    <text x="60" y="161" fill="#f2f8ff" font-size="18" font-weight="700">C# client</text>
    <text x="60" y="190" fill="#c4d6e8" font-size="14">add · ask · delete</text>
    <text x="60" y="213" fill="#c4d6e8" font-size="14">loopback JSON</text>
    <path d="M220 189h48" stroke="#a9d7ff" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="278" y="125" width="180" height="128" rx="20" fill="url(#card)" stroke="#7c9bc0"/>
    <text x="296" y="161" fill="#f2f8ff" font-size="18" font-weight="700">Python API</text>
    <text x="296" y="190" fill="#c4d6e8" font-size="14">root + size checks</text>
    <text x="296" y="213" fill="#c4d6e8" font-size="14">TXT · MD · PDF text</text>
    <path d="M464 189h48" stroke="#a9d7ff" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="522" y="125" width="180" height="128" rx="20" fill="url(#card)" stroke="#7c9bc0"/>
    <text x="540" y="161" fill="#f2f8ff" font-size="18" font-weight="700">Chroma</text>
    <text x="540" y="190" fill="#c4d6e8" font-size="14">chunks + source</text>
    <text x="540" y="213" fill="#c4d6e8" font-size="14">lexical hash vector</text>
    <path d="M708 189h48" stroke="#a9d7ff" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="766" y="125" width="190" height="128" rx="20" fill="url(#card)" stroke="#90c6b4"/>
    <text x="784" y="161" fill="#f2f8ff" font-size="18" font-weight="700">Result</text>
    <text x="784" y="190" fill="#c4d6e8" font-size="14">source excerpt</text>
    <text x="784" y="213" fill="#c4d6e8" font-size="14">or no-answer</text>
    <rect x="522" y="282" width="434" height="48" rx="15" fill="#13283d" stroke="#7b91a8" stroke-dasharray="6 5"/>
    <text x="546" y="312" fill="#aebed2" font-size="15">Future gate: licensed local LLM + grounding evaluation</text>
  </g>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9" fill="none" stroke="#a9d7ff" stroke-width="2"/></marker></defs>
</svg>
